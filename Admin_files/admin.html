    <header class="header">

    <!-- Stats Cards (Attendance, Leaves, Students) -->

        <div class="metric-detail">CSE Sem 6</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="todayAttendance">0%</div>
        <div class="metric-label">Today Attendance</div>
        <div class="metric-detail" id="attendanceDetail">0/42 scanned</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="pendingLeaves">0</div>
        <div class="metric-label">Pending Leaves</div>
        <div class="metric-detail">Real-time</div>
      </div>
    </div>

<div class="quick-actions">
  <!-- Export -->
  <div class="action-card" onclick="exportAttendance()">
    <div class="action-icon">📤</div>
    <div class="action-title">Attendence Report</div>
  </div>
  
  <!-- Leaves - FIXED -->
  <a href="leaves/leaves.html" class="action-card" data-action="approve-leaves">
    <div class="action-icon">📋</div>
    <div class="action-title">Approve Leaves</div>
  </a>
  
  <!-- Notices -->
  <a href="notices/notices.html" class="action-card" data-action="send-notice">
    <div class="action-icon">📢</div>
    <div class="action-title">Post Notice</div>
  </a>
  
  <!-- Gate Pass -->
  <a href="gatepass/gatepass.html" class="action-card" data-action="gatepass">
    <div class="action-icon">🚪</div>
    <div class="action-title">Gate Pass</div>
  </a>
  
  <!-- Results -->
  <a href="results/results.html" class="action-card" data-action="share-results">

  </a>
