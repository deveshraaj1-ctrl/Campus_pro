<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Leave Requests | Campus Pro</title>
    
    <!-- Fonts + Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="leaves.css">
</head>
<body>
    <div class="app">
        <!-- Enhanced Header with Back Button -->
        <header class="header">
            <div class="header-content">
                <button class="back-btn" onclick="goBack()">←</button>
                <h1> Leave Requests</h1>
                <div class="header-actions">
                    <button class="refresh-btn" onclick="loadLeaveRequests()">↻</button>
                  </div>
                  <div class="notification-bell" onclick="showNotifications()">🔔</div>
            </div>
            <!-- <div class="header-subtitle">
                CSE Sem 6 | <span id="livePending">0</span> pending leaves
            </div> -->
        </header>

        <!-- Live Metrics -->
        <div class="metrics-container">
            <div class="metric-card">
                <div class="metric-icon">📄</div>
                <div class="metric-info">
                    <span class="metric-label">Total Requests</span>
                    <span class="metric-value" id="totalRequests">0</span>
                </div>
            </div>
            <div class="metric-card pending">
                <div class="metric-icon">⏳</div>
                <div class="metric-info">
                    <span class="metric-label">Pending</span>
                    <span class="metric-value" id="pendingCount">0</span>
                </div>
            </div>
            <div class="metric-card approved">
                <div class="metric-icon">✅</div>
                <div class="metric-info">
                    <span class="metric-label">Approved</span>
                    <span class="metric-value" id="approvedCount">0</span>
                </div>
            </div>
            <div class="metric-card rejected">
                <div class="metric-icon">❌</div>
                <div class="metric-info">
                    <span class="metric-label">Rejected</span>
                    <span class="metric-value" id="rejectedCount">0</span>
                </div>
            </div>
        </div>

        <!-- Enhanced Table Section -->
        <div class="table-container">
            <div class="table-header">
                <h2>All Leave Requests</h2>
                <div class="table-controls">
                    <input type="text" id="searchInput" placeholder="Search by name or ID...">
                    <button class="bulk-action-btn" onclick="exportLeaves()">📤 Export</button>
                </div>
            </div>
            <div class="table-stats">
                Showing <span id="visibleCount">0</span> of <span id="totalVisible">0</span> requests
            </div>
            <div class="table-wrapper">
                <table id="leavesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leavesTableBody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📋</div>
                    <p>No leave requests yet</p>
                    <small>Requests appear here when students submit</small>
                </div>
            </div>
        </div>

        <!-- Footer Navigation -->
        <!-- <nav class="footer-nav">
            <a href="../admin.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Dashboard</span>
            </a> 
            <a href="#" class="nav-item active">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Leaves</span>
            </a>
        </nav> -->
    </div>

    <script src="leaves.js"></script>
</body>
</html>
