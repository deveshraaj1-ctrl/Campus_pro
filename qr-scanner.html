<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - Campus Pro</title>
  <link rel="stylesheet" href="student.css">
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
        <h1>Scan QR Code</h1>
      </div>
      <div id="scanStatus" style="font-size: 14px; color: white; font-weight: 600;">Point camera at QR code</div>
    </header>

    <!-- Scanner Container -->
    <div class="scanner-container" style="flex: 1; position: relative; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
      
      <!-- Video + Canvas -->
      <div style="position: relative; width: 100%; max-width: 350px; height: 350px; margin-bottom: 30px;">
        <video id="video" autoplay playsinline style="width: 100%; height: 100%; border-radius: 20px; object-fit: cover;"></video>
        <canvas id="canvas" style="display: none;"></canvas>
        
        <!-- QR Frame Overlay -->
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; border: 4px solid #10b981; border-radius: 20px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.7);">
          <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: #10b981;"></div>
          <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: #10b981;"></div>
          <div style="position: absolute; top: 50%; right: 20px; transform: translateY(-50%); width: 4px; height: 60px; background: #10b981;"></div>
          <div style="position: absolute; top: 50%; left: 20px; transform: translateY(-50%); width: 4px; height: 60px; background: #10b981;"></div>
        </div>
      </div>

      <!-- Instructions -->
      <div style="text-align: center; color: white; max-width: 280px;">
        <p style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">Position QR code inside frame</p>
        <p style="font-size: 14px; opacity: 0.9;">Hold steady for 2 seconds</p>
      </div>

      <!-- Flashlight Toggle -->
      <button id="flashToggle" style="position: absolute; top: 80px; right: 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 48px; height: 48px; color: white; backdrop-filter: blur(10px);">
        <svg id="flashIcon" width="20" height="20" fill="white" viewBox="0 0 24 24">
          <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>

      <!-- Manual Test Button -->
      <button onclick="testAttendance()" style="position: absolute; bottom: 100px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px 24px; border-radius: 25px; font-weight: 700; font-size: 16px;">
        Test Scan
      </button>
    </div>
  </div>

  <script>
    let stream = null;
    let scanning = false;

    document.addEventListener('DOMContentLoaded', async function() {
      // Session check
      const user = JSON.parse(localStorage.getItem('campusProUser'));
      if (!user || user.role !== 'student') {
        window.location.href = 'login.html';
        return;
      }

      await initCamera();
      startScanning();
    });

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        
        requestAnimationFrame(tick);
      } catch (err) {
        document.getElementById('scanStatus').textContent = 'Camera access denied';
        console.error('Camera error:', err);
      }
    }

    function startScanning() {
      scanning = true;
      tick();
    }

    function tick() {
      if (!scanning) return;
      
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
          onScanSuccess(code.data);
          return;
        }
      }
      
      requestAnimationFrame(tick);
    }

    function onScanSuccess(decodedText) {
      scanning = false;
      document.getElementById('scanStatus').textContent = '✅ Attendance Marked!';
      
      // Mark attendance
      markAttendance();
      
      // Stop camera
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      
      setTimeout(() => {
        window.location.href = 'student.html';
      }, 1500);
    }

    async function markAttendance() {
      const user = JSON.parse(localStorage.getItem('campusProUser'));
      const attendance = JSON.parse(localStorage.getItem('studentAttendance') || '[]');
      
      const today = new Date().toISOString().split('T')[0];
      const newEntry = {
        id: Date.now(),
        studentId: user.id,
        date: today,
        status: 'present',
        timestamp: new Date().toISOString()
      };
      
      attendance.push(newEntry);
      localStorage.setItem('studentAttendance', JSON.stringify(attendance));
      
      // Update dashboard stats
      updateDashboardStats();
    }

    function updateDashboardStats() {
      const attendance = JSON.parse(localStorage.getItem('studentAttendance') || '[]');
      const totalDays = 25;
      const attendedDays = new Set(attendance.map(a => a.date)).size;
      const percentage = Math.round((attendedDays / totalDays) * 100);
      
      localStorage.setItem('attendancePercentage', percentage.toString());
    }

    function goBack() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      window.location.href = 'student.html';
    }

    // Flashlight toggle
    document.getElementById('flashToggle').addEventListener('click', async function() {
      if (!stream) return;
      
      const track = stream.getVideoTracks()[0];
      const capabilities = track.getCapabilities();
      
      if (capabilities.torch) {
        try {
          await track.applyConstraints({ advanced: [{ torch: true }] });
          document.getElementById('flashIcon').style.fill = '#fbbf24';
        } catch (err) {
          console.log('Flash not available');
        }
      }
    });

    // Test button
    function testAttendance() {
      onScanSuccess('TEST-123');
    }
  </script>
</body>
</html>
