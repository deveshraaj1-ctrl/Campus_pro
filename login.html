<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Pro - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <!-- YOUR LOGO [file:161] -->
    <div class="login-logo">
      <img src="asset\campus-pro-logo.png" alt="Campus Pro">
    </div>
    
    <!-- Student/Admin Toggle -->
    <div class="role-toggle">
      <button class="role-btn active" data-role="student">
        <span class="role-icon">👨‍🎓</span>
        Student
      </button>
      <button class="role-btn" data-role="admin">
        <span class="role-icon">👨‍💼</span>
        Admin
      </button>
    </div>
    
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="student@campus.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••" required>
      </div>
      <div class="rf">
      <label class="checkbox-container">
        <input type="checkbox" id="rememberMe">
        <span class="checkmark"></span>
        Remember me
      </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
    </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <footer>
      <a href="#">Create Account</a>
    </footer>
  <script src="login.js"></script>
</body>
</html>
